<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body>
<a th:replace="~{fragments/layout :: saltar}"></a>
<nav class="navbar navbar-dark bg-dark barra">
    <div class="container">
        <span class="navbar-brand">
            <i class="bi bi-book" aria-hidden="true"></i>
            <span>Biblioteca</span>
        </span>
    </div>
</nav>
<main class="container" id="contenido">
    <div class="acceso">
        <header class="cabecera">
            <div>
                <h1>Iniciar sesión</h1>
                <p class="resumen">Accede con el email y la contraseña de tu cuenta</p>
            </div>
        </header>

        <div th:if="${param.error}" class="alert alert-danger aviso" role="alert">
            <i class="bi bi-exclamation-triangle" aria-hidden="true"></i>
            <span>Email o contraseña incorrectos</span>
        </div>
        <div th:if="${param.logout}" class="alert alert-success aviso" role="status">
            <i class="bi bi-check-circle" aria-hidden="true"></i>
            <span>Has cerrado la sesión correctamente</span>
        </div>

        <form class="ficha ficha-margen" th:action="@{/login}" method="post">
            <div class="ficha-cabecera">
                <h2>Credenciales</h2>
            </div>
            <div class="ficha-cuerpo">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" name="email" class="form-control" required autofocus
                           autocomplete="username" th:classappend="${param.error} ? 'is-invalid'">
                </div>
                <div>
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" name="password" class="form-control" required
                           autocomplete="current-password" th:classappend="${param.error} ? 'is-invalid'">
                </div>
            </div>
            <div class="ficha-pie">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> Entrar
                </button>
            </div>
        </form>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Libros')}"></head>
<body>
<a th:replace="~{fragments/layout :: saltar}"></a>
<nav th:replace="~{fragments/layout :: navbar('libros')}"></nav>
<main class="container" id="contenido">
    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <div class="formulario">
        <header class="cabecera">
            <div class="cabecera-con-signatura">
                <th:block th:unless="${esNuevo}"><span th:replace="~{fragments/layout :: signatura(${libro})}"></span></th:block>
                <div>
                <h1 th:text="${esNuevo} ? 'Nuevo libro' : 'Editar libro'">Nuevo libro</h1>
                <p class="resumen" th:text="${esNuevo} ? 'Ficha de un título nuevo para el catálogo' : ${libro.titulo}">Ficha de un título nuevo para el catálogo</p>
                </div>
            </div>
        </header>

        <form class="ficha ficha-margen" method="post" th:object="${libro}"
              th:action="${esNuevo} ? @{/libros/nuevo} : @{/libros/{id}/editar(id=${libro.id})}" novalidate>
            <div class="ficha-cabecera">
                <h2>Datos del libro</h2>
                <p class="leyenda-obligatorio">* obligatorio</p>
            </div>
            <div class="ficha-cuerpo">
                <div class="row g-3">
                    <div class="col-12">
                        <label for="titulo" class="form-label obligatorio">Título</label>
                        <input type="text" id="titulo" class="form-control" th:field="*{titulo}" required maxlength="200"
                               th:classappend="${#fields.hasErrors('titulo')} ? 'is-invalid'"
                               th:attr="aria-describedby=${#fields.hasErrors('titulo')} ? 'titulo-error'">
                        <div id="titulo-error" class="invalid-feedback" th:errors="*{titulo}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="isbn" class="form-label obligatorio">ISBN</label>
                        <input type="text" id="isbn" class="form-control datos" th:field="*{isbn}" required maxlength="20"
                               inputmode="numeric" autocomplete="off"
                               th:classappend="${#fields.hasErrors('isbn')} ? 'is-invalid'"
                               th:attr="aria-describedby=${#fields.hasErrors('isbn')} ? 'isbn-error' : 'isbn-ayuda'">
                        <div id="isbn-ayuda" class="form-text">No puede repetirse en el catálogo</div>
                        <div id="isbn-error" class="invalid-feedback" th:errors="*{isbn}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="editorial" class="form-label">Editorial</label>
                        <input type="text" id="editorial" class="form-control" th:field="*{editorial}" maxlength="150"
                               th:classappend="${#fields.hasErrors('editorial')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{editorial}"></div>
                    </div>
                    <div class="col-sm-6">
                        <label for="anioPublicacion" class="form-label">Año de publicación</label>
                        <input type="number" id="anioPublicacion" class="form-control datos" th:field="*{anioPublicacion}" min="0" max="2100"
                               th:classappend="${#fields.hasErrors('anioPublicacion')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{anioPublicacion}"></div>
                    </div>
                    <div class="col-sm-6">
                        <label for="ejemplaresDisponibles" class="form-label obligatorio">Ejemplares disponibles</label>
                        <input type="number" id="ejemplaresDisponibles" class="form-control datos" th:field="*{ejemplaresDisponibles}" min="0" required
                               th:classappend="${#fields.hasErrors('ejemplaresDisponibles')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{ejemplaresDisponibles}"></div>
                    </div>
                    <div class="col-12">
                        <fieldset>
                            <legend class="form-label fs-6">Autores</legend>
                            <p th:if="${#lists.isEmpty(autoresDisponibles)}" class="form-text">
                                No hay autores todavía. <a th:href="@{/autores/nuevo}">Crea uno</a> y vuelve a este libro.
                            </p>
                            <div th:unless="${#lists.isEmpty(autoresDisponibles)}" class="lista-autores">
                                <div class="form-check" th:each="a : ${autoresDisponibles}">
                                    <input class="form-check-input" type="checkbox" name="autorIds"
                                           th:id="'autor-' + ${a.id}" th:value="${a.id}"
                                           th:checked="${#lists.contains(autorIdsSeleccionados, a.id)}">
                                    <label class="form-check-label" th:for="'autor-' + ${a.id}" th:text="${a.nombre}">Gabriel García Márquez</label>
                                </div>
                            </div>
                            <div class="form-text">Marca todos los autores del libro.</div>
                        </fieldset>
                    </div>
                </div>
            </div>
            <div class="ficha-pie">
                <a class="btn btn-secondary" th:href="@{/libros}">Cancelar</a>
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg" aria-hidden="true"></i> Guardar</button>
            </div>
        </form>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>

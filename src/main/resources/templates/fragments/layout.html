<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · Biblioteca'">Biblioteca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/biblioteca.css}" href="../../static/css/biblioteca.css" rel="stylesheet">
</head>
<body>

<a th:fragment="saltar" class="saltar" href="#contenido">Saltar al contenido</a>

<nav th:fragment="navbar(activo)" class="navbar navbar-expand-lg navbar-dark bg-dark barra">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <i class="bi bi-book" aria-hidden="true"></i>
            <span>Biblioteca</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'inicio'} ? 'active'" th:attr="aria-current=${activo == 'inicio'} ? 'page'" th:href="@{/}">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'libros'} ? 'active'" th:attr="aria-current=${activo == 'libros'} ? 'page'" th:href="@{/libros}">Libros</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'usuarios'} ? 'active'" th:attr="aria-current=${activo == 'usuarios'} ? 'page'" th:href="@{/usuarios}">Usuarios</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'prestamos'} ? 'active'" th:attr="aria-current=${activo == 'prestamos'} ? 'page'" th:href="@{/prestamos}">Préstamos</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'autores'} ? 'active'" th:attr="aria-current=${activo == 'autores'} ? 'page'" th:href="@{/autores}">Autores</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Mensajes flash: atributos "exito" y "error" (RedirectAttributes.addFlashAttribute) -->
<div th:fragment="mensajes">
    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show aviso" role="status">
        <i class="bi bi-check-circle" aria-hidden="true"></i>
        <span th:text="${exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar aviso"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show aviso" role="alert">
        <i class="bi bi-exclamation-triangle" aria-hidden="true"></i>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar aviso"></button>
    </div>
</div>

<!-- Estado de un préstamo como sello de tinta -->
<span th:fragment="estado(p)" class="sello"
      th:classappend="${p.estado.name() == 'ACTIVO'} ? 'sello-activo' : (${p.estado.name() == 'DEVUELTO'} ? 'sello-devuelto' : 'sello-retrasado')"
      th:text="${p.estado}">ACTIVO</span>

<!-- Signatura topográfica: tres letras del primer apellido del autor y tres del título sin artículo -->
<span th:fragment="signatura(l)" class="signatura"
      th:with="nombres=${#lists.sort(l.autores.![nombre])},
               apellido=${nombres.isEmpty()} ? '' : ${nombres[0].replaceFirst('^[^ ]+ +((de|del|la) +)*', '').toUpperCase()},
               titulo=${l.titulo == null} ? '' : ${l.titulo.replaceFirst('^(?i)(el|la|los|las|un|una) +', '').toLowerCase()}">
    <span class="signatura-autor" th:text="${apellido.length() > 3} ? ${apellido.substring(0, 3)} : (${apellido.isEmpty()} ? '—' : ${apellido})">GAR</span>
    <span class="signatura-titulo" th:text="${titulo.length() > 3} ? ${titulo.substring(0, 3)} : ${titulo}">cie</span>
</span>

<footer th:fragment="footer" class="pie">
    <div class="container">Biblioteca · FP065 Producto 2 · Spring Boot, Thymeleaf y MariaDB</div>
</footer>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>

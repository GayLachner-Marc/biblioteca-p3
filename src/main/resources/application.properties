spring.application.name=app-backend-p1

# Base de datos MariaDB (sobrescribible con variables de entorno)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/biblioteca}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:biblioteca}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:biblioteca}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# El esquema lo crea db/init.sql; JPA solo valida que coincide con las entidades
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

spring.thymeleaf.cache=false

# Sesión solo por cookie (evita ;jsessionid= en las URLs)
server.servlet.session.tracking-modes=cookie

services:
  db:
    image: mariadb:11
    container_name: biblioteca-db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: biblioteca
      MARIADB_USER: biblioteca
      MARIADB_PASSWORD: biblioteca
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  app:
    build: .
    container_name: biblioteca-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/biblioteca
      SPRING_DATASOURCE_USERNAME: biblioteca
      SPRING_DATASOURCE_PASSWORD: biblioteca
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  db_data:
